name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }}, no optional deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest ct_tests.py -v

      - name: Run demos
        run: |
          python demo.py
          python bootstrap_demo.py
          python backend_demo.py

  test-matplotlib:
    name: Tests (with matplotlib)
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install optional dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest ct_tests.py -v

      - name: Run demos
        run: |
          python demo.py
          python bootstrap_demo.py
          python backend_demo.py
